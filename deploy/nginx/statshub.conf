# Nginx para StatsHub Deportivo en un servidor (EC2 Ubuntu).
# Sirve el frontend compilado (React/Vite) y hace de proxy hacia la API (Node en 127.0.0.1:3000).
# Reemplaza statshub.cl por tu dominio. Certificado HTTPS con: sudo certbot --nginx -d statshub.cl -d www.statshub.cl
#
# Copiar a /etc/nginx/sites-available/statshub y enlazar en sites-enabled.

limit_req_zone $binary_remote_addr zone=statshub_api:10m rate=20r/s;

server {
    listen 80;
    server_name statshub.cl www.statshub.cl;
    # certbot reemplaza este bloque por la redirección a HTTPS (RNF-06).
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name statshub.cl www.statshub.cl;

    # Rutas creadas por certbot
    ssl_certificate     /etc/letsencrypt/live/statshub.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/statshub.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Cabeceras de seguridad del frontend (la API agrega las suyas con helmet).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 3m;   # escudos: hasta 2 MB
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---------- Frontend (PWA) ----------
    root /var/www/statshub/frontend;   # contenido de StatsHub-Frontend/dist
    index index.html;

    # Archivos con hash en el nombre: caché larga.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # El service worker y el manifest nunca se cachean (si no, la PWA no se actualiza).
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }
    # Rutas de React Router → index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # ---------- API ----------
    # Tiempo real (Server-Sent Events): sin buffer y con conexiones largas.
    location = /api/tiempo-real {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        limit_req zone=statshub_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Escudos de equipos (generados por la API en UPLOADS_DIR).
    location /uploads/ {
        alias /var/www/statshub/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
}
